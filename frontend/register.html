<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create account | BUG-ZERO</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;800&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="css/style.css"></head>
<body>
<nav class="nav"><a class="logo" href="index.html">BUG<b>-</b>ZERO</a></nav>
<main class="auth-wrap"><div class="auth-card">
  <h1>Create your account</h1><p class="sub">Save every analysis to your own history.</p>
  <form id="auth-form" data-mode="register" novalidate>
    <label for="username">Username</label><input id="username" name="username" type="text" autocomplete="username" required minlength="3">
    <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required>
    <label for="password">Password (8+ characters)</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="8">
    <button class="btn" type="submit">Create account</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>
  <p class="alt">Already registered? <a href="login.html">Log in</a></p>
</div></main>
<script src="js/api.js"></script><script src="js/auth.js"></script>
</body></html>
