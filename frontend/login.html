<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in | BUG-ZERO</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;800&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="css/style.css"></head>
<body>
<nav class="nav"><a class="logo" href="index.html">BUG<b>-</b>ZERO</a></nav>
<main class="auth-wrap"><div class="auth-card">
  <h1>Welcome back</h1><p class="sub">Log in to see your bug reports.</p>
  <form id="auth-form" data-mode="login" novalidate>
    <label for="identifier">Email or username</label><input id="identifier" name="identifier" type="text" autocomplete="username" required>
    <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit">Log in</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>
  <p class="alt">New here? <a href="register.html">Create an account</a></p>
</div></main>
<script src="js/api.js"></script><script src="js/auth.js"></script>
</body></html>
